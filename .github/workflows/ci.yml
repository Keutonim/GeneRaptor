# GeneRaptor CI: install + validate + typecheck + test + build on Node 20/22.
# Local equivalents (verified in the dev worktree):
#   npm ci
#   npm test            (vitest run; SQLite test DB via tests/global-setup.mjs)
#   npm run typecheck   (tsc --noEmit)
#   npm run build       (tsc --noEmit && vite build)
#   npm run test:e2e    (playwright; own SQLite stack in tests/e2e/server-stack.mjs)
#   npm run lint:brand   (brand gate: no legacy brand tokens in the shipped set)
#   npm run lint:universal (universal gate: no single-industry domain tokens in the role/prompt zone)
#
# No PostgreSQL and no Redis: GeneRaptor stores everything in a local SQLite
# file, so the CI needs no service containers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        env:
          DATABASE_URL: file:./ci-validate.db
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (SQLite)
        run: npm run test:e2e

      - name: Brand gate (no legacy brand tokens in the shipped set)
        run: npm run lint:brand

      - name: Universal gate (no single-industry domain tokens in the role/prompt zone)
        run: npm run lint:universal

      # SEC-17: the install step runs with --no-audit, so the audit lives in
      # its OWN step — a high/critical advisory in the production tree fails
      # the job instead of scrolling past in the install log.
      - name: Dependency audit (no high/critical advisory in the production tree)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (only when package.json defines a lint script)
        run: |
          if node -e "const scripts=require('./package.json').scripts||{};process.exit(scripts.lint?0:1)"; then
            npm run lint
          else
            echo "package.json defines no 'lint' script - nothing to lint (brand gate runs above)."
          fi
